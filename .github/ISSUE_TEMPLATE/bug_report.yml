name: Bug report
description: 不具合を報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        不具合の報告フォームです。再現できる情報をできるだけ具体的に書いてください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているかを1〜2文で書いてください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 番号付きで、誰でも同じ結果になる手順を書いてください。
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージがあればそのまま貼ってください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      description: OS、バージョンなど。
      placeholder: Ubuntu 22.04 / v1.2.3
  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 同じ内容の Issue が無いことを確認した
          required: true
